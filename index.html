<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <title>Clean Multi-Screen Monitoring</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; }
    
    /* 6 ਸਕ੍ਰੀਨਾਂ ਲਈ 3 ਕਾਲਮ ਅਤੇ 2 ਕਤਾਰਾਂ ਬਿਨਾਂ ਕਿਸੇ ਖ਼ਾਲੀ ਜਗ੍ਹਾ ਦੇ */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      grid-template-rows: repeat(2, 1fr); 
      gap: 2px; 
      height: 100vh; 
      width: 100vw;
      background: #000;
    }
    
    .card { 
      position: relative; 
      background: #000; 
      overflow: hidden; 
      display: flex;
    }
    
    /* ਉੱਪਰਲਾ ਬਾਰ ਆਮ ਤੌਰ 'ਤੇ ਲੁਕਿਆ ਰਹੇਗਾ, ਜਦੋਂ ਮਾਊਸ ਉੱਪਰ ਜਾਵੇਗਾ ਤਾਂ ਹੀ ਦਿਖੇਗਾ */
    .header { 
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, 0.85); 
      padding: 6px 10px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
    
    .card:hover .header { 
      opacity: 1; 
    }
    
    .title { font-weight: bold; color: #ff3333; font-size: 12px; }
    .controls { display: flex; gap: 4px; }
    .controls input { background: #222; border: 1px solid #555; color: #fff; padding: 3px 6px; font-size: 11px; width: 120px; border-radius: 2px; }
    .controls button { background: #cc0000; color: #fff; border: none; padding: 3px 8px; font-size: 11px; cursor: pointer; border-radius: 2px; }
    
    .video-box { 
      width: 100%; 
      height: 100%; 
      position: relative; 
    }
    
    iframe { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      border: none; 
    }
  </style>
</head>
<body>

<div class="grid" id="grid"></div>

<script>
  const streams = [
    { title: "DPHH", id: "qZg1JI-_eTs" },
    { title: "NW", id: "KMWcefrAKLg" },
    { title: "ZEE", id: "eV5KYTHCVnc" },
    { title: "LI", id: "5UPhf1Fo_p8" },
    { title: "AAJ TAK", id: "Nq2wYlWFucg" },
    { title: "PTC", id: "XJvCiFmOOmM" }
  ];

  function getID(text) {
    const match = text.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
    return (match && match[2].length === 11) ? match[2] : text.trim();
  }

  // controls=0 ਨਾਲ YouTube ਦੇ ਸਾਰੇ ਬਟਨ ਬੰਦ ਹੋ ਜਾਂਦੇ ਹਨ
  function buildSrc(id) {
    return "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&playsinline=1";
  }

  const container = document.getElementById("grid");

  streams.forEach((item, i) => {
    const saved = localStorage.getItem("yt_clean_slot_" + i) || item.id;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="header">
        <span class="title">${item.title}</span>
        <div class="controls">
          <input type="text" id="in_${i}" placeholder="ਨਵੀਂ ID...">
          <button onclick="updateSlot(${i})">Update</button>
        </div>
      </div>
      <div class="video-box">
        <iframe id="frame_${i}" 
                src="${buildSrc(saved)}" 
                loading="lazy" 
                allow="autoplay; fullscreen" 
                allowfullscreen></iframe>
      </div>
    `;
    container.appendChild(card);
  });

  function updateSlot(i) {
    const val = document.getElementById("in_" + i).value.trim();
    if (val) {
      const vid = getID(val);
      localStorage.setItem("yt_clean_slot_" + i, vid);
      document.getElementById("frame_" + i).src = buildSrc(vid);
      document.getElementById("in_" + i).value = "";
    }
  }
</script>
</body>
</html>
