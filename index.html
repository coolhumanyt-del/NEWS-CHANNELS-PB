<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <title>PUNJABI NEWS LIVE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      background: radial-gradient(circle at center, #0f1c3f 0%, #080d1a 60%, #03060c 100%);
      color: #fff; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      height: 100vh; 
      width: 100vw; 
      overflow: hidden; 
      display: flex;
      flex-direction: column;
    }
    
    /* ਸੈਂਟਰ ਬ੍ਰਾਂਡਿੰਗ + ਲਾਈਵ ਸਿੰਕ ਬਟਨ */
    .news-ticker-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      background: linear-gradient(135deg, #d31027 0%, #ea384d 100%);
      padding: 6px 24px;
      border-radius: 40px;
      border: 2px solid #ff7675;
      box-shadow: 0 0 25px rgba(234, 56, 77, 0.7);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .news-ticker-bar:hover {
      transform: translate(-50%, -50%) scale(1.04);
    }

    .live-dot {
      width: 12px;
      height: 12px;
      background-color: #fff;
      border-radius: 50%;
      animation: blink 1.2s infinite ease-in-out;
      box-shadow: 0 0 10px #fff;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
    }

    .brand-title {
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
      white-space: nowrap;
    }

    .sync-hint {
      font-size: 10px;
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 10px;
      color: #ffcccc;
    }

    .grid { 
      display: grid; 
      grid-template-columns: repeat(3, 1fr); 
      grid-template-rows: repeat(2, 1fr); 
      gap: 3px; 
      height: 100vh; 
      width: 100vw;
      background: transparent;
      padding: 2px;
    }
    
    .card { 
      position: relative; 
      background: #000; 
      overflow: hidden; 
      border: 1px solid rgba(0, 168, 255, 0.35);
      border-radius: 4px;
    }
    
    .header { 
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(8, 13, 26, 0.9); 
      padding: 6px 10px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 20;
      opacity: 0;
      transition: opacity 0.2s;
      border-bottom: 1px solid #00a8ff;
    }
    
    .card:hover .header { 
      opacity: 1; 
    }
    
    .title { font-weight: bold; color: #00d2d3; font-size: 11px; letter-spacing: 1px; }
    .controls { display: flex; gap: 4px; }
    .controls input { background: #111a2e; border: 1px solid #00a8ff; color: #fff; padding: 2px 6px; font-size: 11px; width: 110px; border-radius: 3px; }
    .controls button { background: #e84118; color: #fff; border: none; padding: 2px 8px; font-size: 11px; cursor: pointer; border-radius: 3px; font-weight: bold; }
    
    .video-box { 
      width: 100%; 
      height: 100%; 
      position: relative; 
      overflow: hidden;
    }
    
    iframe { 
      position: absolute; 
      top: -6%;
      left: 0;
      width: 100%; 
      height: 112%; 
      border: none; 
    }
  </style>
</head>
<body>

  <!-- ਸੈਂਟਰ ਬੈਜ: ਇਸ 'ਤੇ ਕਲਿੱਕ ਕਰਨ ਨਾਲ ਸਾਰੇ ਚੈਨਲ ਤੁਰੰਤ Live Edge 'ਤੇ ਰੀਲੋਡ ਹੋ ਜਾਣਗੇ -->
  <div class="news-ticker-bar" onclick="syncAllLive()" title="ਲਾਈਵ ਸਿੰਕ ਕਰਨ ਲਈ ਕਲਿੱਕ ਕਰੋ">
    <div class="live-dot"></div>
    <span class="brand-title">PUNJABI NEWS LIVE</span>
    <span class="sync-hint">SYNC</span>
  </div>

  <div class="grid" id="grid"></div>

<script>
  const streams = [
    { title: "DPHH", id: "qZg1JI-_eTs" },
    { title: "NW", id: "KMWcefrAKLg" },
    { title: "ZEE", id: "eV5KYTHCVnc" },
    { title: "LI", id: "5UPhf1Fo_p8" },
    { title: "AAJ TAK", id: "Nq2wYlWFucg" },
    { title: "PTC", id: "XJvCiFmOOmM" }
  ];

  function getID(text) {
    const match = text.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
    return (match && match[2].length === 11) ? match[2] : text.trim();
  }

  // ਲਾਈਵ ਪੁਆਇੰਟ ਫੜਨ ਲਈ ਪੈਰਾਮੀਟਰ
  function buildSrc(id) {
    const timeNow = Date.now();
    return "https://www.youtube-nocookie.com/embed/" + id + 
           "?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&playsinline=1&live=1&_cb=" + timeNow;
  }

  const container = document.getElementById("grid");

  streams.forEach((item, i) => {
    const saved = localStorage.getItem("yt_clean_slot_" + i) || item.id;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="header">
        <span class="title">${item.title}</span>
        <div class="controls">
          <input type="text" id="in_${i}" placeholder="ਨਵੀਂ ID...">
          <button onclick="updateSlot(${i})">Update</button>
        </div>
      </div>
      <div class="video-box">
        <iframe id="frame_${i}" 
                src="${buildSrc(saved)}" 
                allow="autoplay; fullscreen" 
                allowfullscreen></iframe>
      </div>
    `;
    container.appendChild(card);
  });

  function updateSlot(i) {
    const val = document.getElementById("in_" + i).value.trim();
    if (val) {
      const vid = getID(val);
      localStorage.setItem("yt_clean_slot_" + i, vid);
      document.getElementById("frame_" + i).src = buildSrc(vid);
      document.getElementById("in_" + i).value = "";
    }
  }

  // ਸਾਰੇ ਚੈਨਲਾਂ ਨੂੰ ਇੱਕੋ ਸਮੇਂ ਤਾਜ਼ਾ ਲਾਈਵ 'ਤੇ ਲਿਆਉਣ ਲਈ ਫੰਕਸ਼ਨ
  function syncAllLive() {
    streams.forEach((item, i) => {
      const currentId = localStorage.getItem("yt_clean_slot_" + i) || item.id;
      const frame = document.getElementById("frame_" + i);
      if (frame) {
        frame.src = buildSrc(currentId);
      }
    });
  }
</script>
</body>
</html>
