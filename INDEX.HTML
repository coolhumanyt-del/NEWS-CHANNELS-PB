<!DOCTYPE html>
<html lang="pa">
<head>
  <meta charset="UTF-8">
  <title>Open Multi-Screen TV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: 4px; height: 100vh; padding: 4px; }
    .card { background: #111; display: flex; flex-direction: column; border: 1px solid #333; }
    .header { background: #151515; padding: 4px 6px; display: flex; justify-content: space-between; align-items: center; }
    .title { font-weight: bold; color: #ff3b30; font-size: 11px; }
    .controls { display: flex; gap: 4px; }
    .controls input { background: #222; border: 1px solid #444; color: #fff; padding: 2px 4px; font-size: 10px; width: 110px; border-radius: 2px; }
    .controls button { background: #cc0000; color: #fff; border: none; padding: 2px 6px; font-size: 10px; cursor: pointer; border-radius: 2px; }
    .video-box { flex: 1; position: relative; }
    iframe { position: absolute; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

<div class="grid" id="grid"></div>

<script>
  const streams = [
    { title: "DPHH", id: "qZg1JI-_eTs" },
    { title: "NW", id: "KMWcefrAKLg" },
    { title: "SPOKESMAN", id: "-bBXOq-BjVY" },
    { title: "ZEE", id: "eV5KYTHCVnc" },
    { title: "LI", id: "5UPhf1Fo_p8" },
    { title: "AAJ TAK", id: "Nq2wYlWFucg" }
  ];

  function getID(text) {
    const match = text.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
    return (match && match[2].length === 11) ? match[2] : text.trim();
  }

  const container = document.getElementById("grid");

  streams.forEach((item, i) => {
    const saved = localStorage.getItem("yt_slot_" + i) || item.id;
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="header">
        <span class="title">${item.title}</span>
        <div class="controls">
          <input type="text" id="in_${i}" placeholder="ਨਵਾਂ ਲਿੰਕ ਜਾਂ ID...">
          <button onclick="updateSlot(${i})">Update</button>
        </div>
      </div>
      <div class="video-box">
        <iframe id="frame_${i}" src="https://www.youtube-nocookie.com/embed/${saved}?autoplay=1&mute=1" allow="autoplay; fullscreen" allowfullscreen></iframe>
      </div>
    `;
    container.appendChild(card);
  });

  function updateSlot(i) {
    const val = document.getElementById("in_" + i).value.trim();
    if (val) {
      const vid = getID(val);
      localStorage.setItem("yt_slot_" + i, vid);
      document.getElementById("frame_" + i).src = "https://www.youtube-nocookie.com/embed/" + vid + "?autoplay=1&mute=1";
      document.getElementById("in_" + i).value = "";
    }
  }
</script>
</body>
</html>
